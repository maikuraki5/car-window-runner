<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>車窗跑酷 AI 2.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,"Noto Sans TC",sans-serif;touch-action:none}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#ui{position:fixed;inset:0;pointer-events:none}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:bold;text-shadow:0 2px 4px #000}.pill{background:#0009;border:1px solid #fff5;border-radius:14px;padding:8px 12px}
#zone{position:absolute;left:30%;top:24%;width:40%;height:58%;border:2px dashed #fff9;border-radius:16px}
#zt{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:#0009;border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap}
#status{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);background:#000c;border-radius:14px;padding:9px 14px;min-width:270px;text-align:center;font-weight:bold}
#buttons{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}
button{border:1px solid #fff7;background:#000b;color:#fff;border-radius:18px;padding:14px 20px;font-size:19px;font-weight:900}
.panel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#000c}.card{width:min(90%,560px);padding:25px;background:#101820f2;border-radius:24px;text-align:center;border:1px solid #fff4}.small{font-size:12px;color:#aaa;line-height:1.5}
#rotate{display:none;position:fixed;inset:0;z-index:99;background:#05080d;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:bold}
@media (orientation:portrait){#rotate{display:flex}}
</style></head><body>
<video id="cam" autoplay playsinline muted></video>
<div id="ui"><div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🧠 <span id="det">等待 AI</span></div></div>
<div id="zone"><div id="zt">AI 危險判斷區</div></div><div id="status">尚未啟動鏡頭</div>
<div id="buttons"><button id="L">◀ 閃左</button><button id="J">⬆ 跳躍</button><button id="R">閃右 ▶</button></div></div>
<div class="panel" id="start"><div class="card"><h1>🚗 車窗跑酷 AI 2.0</h1>
<p>用手機後鏡頭拍攝<strong>真實車外景色</strong>。本版不自行生成障礙物，而是用瀏覽器 AI 嘗試辨識畫面中的真實物體。</p>
<p>當物體進入中央危險區，遊戲提示你選擇「閃左、閃右或跳躍」。</p>
<button id="go">📷 開啟鏡頭並開始</button><p class="small">需要 HTTPS 與網路連線載入 AI 模型。只限乘客使用，駕駛勿操作。</p></div></div>
<div id="rotate">📱↔️<br><br>請將手機橫向</div>
<script>
const video=document.getElementById('cam'),statusEl=document.getElementById('status'),detEl=document.getElementById('det');
let model=null,running=false,busy=false,lastAction=0,score=0;
async function camera(){if(!navigator.mediaDevices?.getUserMedia)throw Error('camera');const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=s;await video.play();}
function act(t){if(!running)return;statusEl.textContent=t;score++;document.getElementById('score').textContent=score;lastAction=performance.now();}
L.onclick=()=>act('◀ 你選擇：閃左');R.onclick=()=>act('你選擇：閃右 ▶');J.onclick=()=>act('⬆ 你選擇：跳躍');
async function loadAI(){
 statusEl.textContent='🧠 正在載入 AI 模型…';
 const a=document.createElement('script');a.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';document.head.appendChild(a);await new Promise((r,j)=>{a.onload=r;a.onerror=j});
 const b=document.createElement('script');b.src='https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3';document.head.appendChild(b);await new Promise((r,j)=>{b.onload=r;b.onerror=j});
 model=await cocoSsd.load();
}
function candidate(p){
 return ['person','car','bus','truck','bicycle','motorcycle','dog','cat','bench','chair','potted plant','traffic light','stop sign'].includes(p.class)&&p.score>=.55;
}
async function detect(){
 if(!running||!model||busy)return;busy=true;
 try{
  const ps=await model.detect(video);detEl.textContent=ps.length+' 個物體';
  let danger=null;
  for(const p of ps){if(!candidate(p))continue;const [x,y,w,h]=p.bbox,cx=(x+w/2)/video.videoWidth,cy=(y+h/2)/video.videoHeight;
   if(cx>.30&&cx<.70&&cy>.25&&cy<.90){danger=p;break;}
  }
  if(danger&&performance.now()-lastAction>1300)statusEl.textContent='⚠️ 偵測到「'+danger.class+'」！請閃避或跳躍';
  else if(!danger&&performance.now()-lastAction>1300)statusEl.textContent='👁️ AI 正在觀察真實場景…';
 }catch(e){statusEl.textContent='AI 辨識失敗，但鏡頭仍可使用';}busy=false;
}
go.onclick=async()=>{try{await camera();document.getElementById('start').style.display='none';running=true;await loadAI();statusEl.textContent='👁️ AI 已啟動，請把鏡頭朝向車窗外';setInterval(detect,500)}catch(e){alert('請使用 HTTPS、允許相機並保持網路連線。');}};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')act('◀ 你選擇：閃左');if(e.key==='ArrowRight')act('你選擇：閃右 ▶');if(e.key==='ArrowUp'||e.key===' ')act('⬆ 你選擇：跳躍')});
</script></body></html>
