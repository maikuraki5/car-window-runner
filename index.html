<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>車窗跑酷 AI 3.0</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif;touch-action:none}#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#hud{position:fixed;top:8px;left:8px;right:8px;z-index:5;display:flex;justify-content:space-between}.pill,#status,#warn,button{background:#000b;color:#fff;border:1px solid #fff6;border-radius:15px;padding:9px;font-weight:800}#zone{position:fixed;z-index:3;left:28%;top:22%;width:44%;height:62%;border:2px dashed #fff9;border-radius:18px}#zone span{font-size:11px;background:#000a;padding:4px;position:absolute;top:4px;left:50%;transform:translateX(-50%);white-space:nowrap}#player{position:fixed;z-index:8;left:50%;bottom:17%;transform:translateX(-50%);font-size:64px;transition:left .12s}#player.jump{animation:jump .62s ease-out}@keyframes jump{0%,100%{bottom:17%}45%{bottom:45%}}#status{position:fixed;z-index:9;bottom:82px;left:50%;transform:translateX(-50%);min-width:260px;text-align:center}#warn{position:fixed;z-index:10;top:15%;left:50%;transform:translateX(-50%);background:#b00000e8;display:none;text-align:center}#buttons{position:fixed;z-index:12;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px}.panel{position:fixed;inset:0;z-index:30;background:#05080df2;display:flex;align-items:center;justify-content:center}.card{width:min(92%,680px);background:#101820f7;border:1px solid #fff4;border-radius:24px;padding:24px;text-align:center}.char{width:125px;margin:6px}.avatar{display:block;font-size:55px}.selected{outline:3px solid #fff}.main{background:#fff;color:#111;border:0}.muted{font-size:12px;color:#aaa}#rotate{display:none;position:fixed;inset:0;z-index:99;background:#05080d;align-items:center;justify-content:center;text-align:center;font-size:22px}@media(orientation:portrait){#rotate{display:flex}}</style></head><body><video id="cam" autoplay playsinline muted></video><div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">❤️ 3</div><div class="pill">🧠 <span id="ai">待機</span></div></div><div id="zone"><span>AI 真實障礙判斷區</span></div><div id="warn"></div><div id="player">🏃</div><div id="status">請選擇人物</div><div id="buttons"><button id="left">◀ 閃左</button><button id="jump">⬆ 跳躍</button><button id="right">閃右 ▶</button></div><div class="panel" id="select"><div class="card"><h1>🚗 車窗跑酷 AI 3.0</h1><p>選擇人物</p><button class="char selected" data-c="🏃"><span class="avatar">🏃</span>跑者</button><button class="char" data-c="🧑"><span class="avatar">🧑</span>冒險家</button><button class="char" data-c="🤖"><span class="avatar">🤖</span>機器人</button><p><button class="main" id="next">下一步</button></p><p class="muted">供乘客使用，駕駛者請勿操作手機。</p></div></div><div class="panel" id="start" style="display:none"><div class="card"><h1>📷 準備開始</h1><p>後鏡頭拍到的真實車外景色就是遊戲背景。</p><p>AI 嘗試辨識人、車、植物等真實物體；進入中央危險區時提示。</p><button class="main" id="go">開啟鏡頭並開始</button><p class="muted">需要 HTTPS、相機權限及網路。</p></div></div><div id="rotate">📱↔️<br><br>請將手機橫向遊玩</div><script>const cam=document.getElementById('cam'),player=document.getElementById('player'),statusEl=document.getElementById('status');let model=null,running=false,busy=false,lane=1,score=0,jumping=false,lastAction=0;const lanes=[27,50,73],targets=['person','car','bus','truck','bicycle','motorcycle','dog','cat','bench','chair','potted plant','traffic light','stop sign'];document.querySelectorAll('.char').forEach(b=>b.onclick=()=>{document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');player.textContent=b.dataset.c});next.onclick=()=>{select.style.display='none';start.style.display='flex'};function setLane(n){lane=Math.max(0,Math.min(2,n));player.style.left=lanes[lane]+'%'}function act(t){if(!running)return;score++;scoreEl.textContent=score;statusEl.textContent=t;lastAction=performance.now()}function move(d){setLane(lane+d);act(d<0?'◀ 向左閃避':'向右閃避')}function doJump(){if(!running||jumping)return;jumping=true;player.classList.add('jump');act('⬆ 跳躍');setTimeout(()=>{player.classList.remove('jump');jumping=false},630)}left.onclick=()=>move(-1);right.onclick=()=>move(1);jump.onclick=doJump;const scoreEl=document.getElementById('score');async function openCam(){if(!navigator.mediaDevices?.getUserMedia)throw Error();const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});cam.srcObject=s;await cam.play()}async function loadAI(){ai.textContent='載入中';const a=document.createElement('script');a.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';document.head.appendChild(a);await new Promise((r,j)=>{a.onload=r;a.onerror=j});const b=document.createElement('script');b.src='https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3';document.head.appendChild(b);await new Promise((r,j)=>{b.onload=r;b.onerror=j});model=await cocoSsd.load();ai.textContent='ON'}async function detect(){if(!running||!model||busy)return;busy=true;try{const ps=await model.detect(cam);let d=null;for(const p of ps){if(!targets.includes(p.class)||p.score<.55)continue;const[x,y,w,h]=p.bbox,cx=(x+w/2)/cam.videoWidth,cy=(y+h/2)/cam.videoHeight;if(cx>.28&&cx<.72&&cy>.22&&cy<.92){d=p;break}}if(d){warn.style.display='block';warn.innerHTML='⚠️ '+d.class+'<br><small>真實物體進入危險區：閃避或跳躍</small>';if(performance.now()-lastAction>1300)statusEl.textContent='⚠️ '+d.class+' 接近！請選擇動作'}else{warn.style.display='none';if(performance.now()-lastAction>1300)statusEl.textContent='👁️ AI 正在分析真實場景…'}}catch(e){ai.textContent='錯誤'}busy=false}go.onclick=async()=>{try{await openCam();start.style.display='none';running=true;setLane(1);await loadAI();statusEl.textContent='👁️ AI 已啟動';setInterval(detect,450)}catch(e){alert('無法開啟鏡頭。請確認 HTTPS、允許相機並保持網路連線。')}};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')doJump()});let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<-45)doJump()},{passive:true});setLane(1)</script></body></html>
